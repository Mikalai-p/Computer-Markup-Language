<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Таблица</title>
        <style>
table{
    border-collapse: separate;
border-width: 2px;
border-color: grey;
border-spacing: 0;
}
th{
    border-style: solid;
border-width: 2px;
border-color: grey;
}
td{
    border-style: solid;
border-width: 2px;
border-color: grey;
}
.blue{
    color:white;
    background-color: #000BFF;
    text-align: center;
}
.aqua{
    color: white;
    background-color: darkblue;
    text-align: center;
}
.purple{
    color:white;
    background-color: purple;
    text-align: center;
}
.green{
    color: white;
    background-color: green;
    text-align: center;
}
.hide{
    visibility: hidden;
}
b{
    font-size: 1.2em;
    text-align: center;
}

        </style>
        </head>
<table>
    <caption><b>Russia:Top smartphone vendors Q1 2021</b></caption>
    <thead>
      <tr>
        <th class="hide"></th>
        <th class="blue">Vendor</th>
        <th class="blue">Unit Share</th>
        <th class="blue">Annual Growth</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>#1 ↑</td>
        <td class="aqua">Xiaomi</td>
        <td class="purple">32%</td>
        <td class="green">+125%</td>
      </tr>
      <tr>
        <td>#2 ↑</td>
        <td class="aqua">Samsung</td>
        <td class="purple">27%</td>
        <td class="green">+41%</td>
      </tr>
      <tr>
        <td>#3 ↑</td>
        <td class="aqua">Honor</td>
        <td class="purple">10%</td>
        <td class="green">0%</td>
      </tr>
      <tr>
        <td>#4 ↔</td>
        <td class="aqua">Apple</td>
        <td class="purple">9%</td>
        <td class="green">+24%</td>
      </tr>
      <tr>
        <td>#5 ↔</td>
        <td class="aqua">Realme</td>
        <td class="purple">9%</td>
        <td class="green">+682%</td>
      </tr>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td class="hide"></td>
        <td class="aqua">Total</td>
        <td class="purple">82%</td>
        <td class="green">682%</td>
      </tr>
    </tfoot>
  </table>
