        <p id = "fig">Вторая круглая башня из трёх - это Водовзводная. Когда эту башню строили, её назвали Свибловой. 
            Там рядом был двор боярина Свиблова . Но... в 1633 году в Кремле началась небывалая стройка. Строили царский 
            водопровод . И делали его по римскому способу из СВИНЦА . По свинцовым трубам вода из Москва - реки при помощи
             насоса заканчивалась в резервуары, которые находились в верней части башни (вот тогда она и стала Водовзводной).
             Сами резервуары для пущей герметичности были обшиты свинцовыми листами. Обратили внимание : трубы и листы свинцовые .
              По таким же свинцовым трубам вода из резервуаров шла в "поварни", "мыльни" и для полива царских садов. А также - в конюшенный,
               хлебный и кормовой дворы. Ооочень долгое время (с 1633 по 1706 годы) царский двор снабжался "бессильной", отравленной водой.
                Современные учёные подсчитали, что содержание свинца в ней превышало норму В 100 РАААЗ . Особо ядовитой вода была утром, когда
                 она за ночь настоялась в свинцовых чанах. И люди в том числе и цари травились этой водой.</p>
