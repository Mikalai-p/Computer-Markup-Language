<!DOCTYPE html>
 <html lang="EN">
     <head>
         <title>Chess Board </title>
          <meta charset="UTF-8"> 
          <style> 
          body{
            background-color: white;
          }
.box th:nth-child(2),
th:nth-child(3),
th:nth-child(4),
th:nth-child(5),
th:nth-child(6),
th:nth-child(7),
th:nth-child(8),
th:nth-child(9){
    border: 1px solid black;
    background-color: gray;
}
.box tr:nth-child(2) th:first-child, 
tr:nth-child(2) th:last-child,
tr:nth-child(3) th:first-child,
tr:nth-child(3) th:last-child,
tr:nth-child(4) th:first-child,
tr:nth-child(4) th:last-child,
tr:nth-child(5) th:first-child,
tr:nth-child(5) th:last-child,
tr:nth-child(6) th:first-child,
tr:nth-child(6) th:last-child,
tr:nth-child(7) th:first-child,
tr:nth-child(7) th:last-child,
tr:nth-child(8) th:first-child,
tr:nth-child(8) th:last-child,
tr:nth-child(9) th:first-child,
tr:nth-child(9) th:last-child
{
    width: 15px;
    border: 1px solid black;
    background-color: gray;
    padding: 7px;
}
  .centered { 
      display: inline-block;
       margin: 0;
      } 
    .chess-board {
        border-spacing: 0;
    border-collapse: collapse;
        } 
    .chess-board th { 
        padding: .3em;
         } 
         .chess-board td {
             border: 1px; 
             width: 4em; 
             height: 4em; 
             text-align: center; 
             vertical-align: middle; 
             } 
            .chess-board  tr:nth-child(even) td:nth-child(odd){
                background: black; 
                } 
                .chess-board  tr:nth-child(odd) td:nth-child(even) { 
                    background: black; 
                    } 
                    .hide {
                        visibility: hidden;
                    }
                    </style> 
                    </head> 
                    <body>
