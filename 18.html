<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        .colored-letters {
            color: red; /* Первая буква */
            font-size: 50px;
            letter-spacing: 10px;
        }
        .colored-letters span:nth-child(2) {
            color: green; /* Вторая буква */
            margin-left: -10px;
        }
        .colored-letters span:nth-child(3) {
            color: blue; /* Третья буква */
            margin-left: -10px;
        }
    </style>
</head>
<body>
    <div class="colored-letters">
        <span>C</span><span>S</span><span>S</span>
    </div>
</body>
</html>
