<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Блок</title>
        <style>
            .block {
    padding: 20px 0; /* Отступ от текста сверху */
    border: 5px dashed rgb(255,0,0);
}

.block::before {
    content: "";
    display: block;
    height: 5px;
    background: red;
    border-top: 1px dotted red;
    border-bottom: 1px dotted red;
}

        </style>
        <body>
            <div class="block">5</div>
        </body>
    </head>
</html>
