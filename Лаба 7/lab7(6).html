    <style>
        body{
    max-width: 100%;
    overflow: hidden;
}

h1{
    text-align: center;
    animation-name: h1;
    animation-iteration-count: infinite;
    animation-duration: 5s;   
}
@keyframes h1 {
    0% {opacity: 0%;}
    50%{opacity: 80%;}
    100%{opacity: 0%;}
   }
div{
    margin: 35px;
    }
    .img1{
        display: block;
    animation-name: img1;
    animation-iteration-count: infinite;
    animation-duration: 5s;
    position: absolute;
    } 
    @keyframes img1 {
        0% { left: 0; }
        50% { left: 200px;}
        100% {left: 0;}
       }
    .img2{
        display: block;
        animation-name: img2;
        animation-iteration-count: infinite;
        animation-duration: 5s;
        position: absolute;
    }
    @keyframes img2 {
        0% { left: 250px; border-radius: none; }
        50% { left: 1000px; border-radius: 50%; }
        100% {left: 250px;border-radius: none;}
       }
    .img3{
        display: block;
        animation-name: img3;
        animation-iteration-count: infinite;
        animation-duration: 5s;
        position: absolute;
        overflow: hidden;
    }
    @keyframes img3 {
        0%{left:-20%;
  }
  100%{left:100%;
  }
}

   
    .img4{
        display: block;
        animation-name: img4;
        animation-iteration-count: infinite;
        animation-duration: 3s;
        position: absolute;
    }
    @keyframes img4 {
        0% { bottom: 0px; }
        50% { bottom: 50px;}
        100% {bottom: 0px;}
       }
    .img5{
        display: block;
        animation-name: img5;
        animation-iteration-count: infinite;
        animation-duration: 5s;
        position: absolute;
    }
    @keyframes img5 {
        0% { left:0; top:0;}
       25%{left:800px; top:0;}
       50%{left: 800px; top:400px;}
    75%{left:0; top:400px;}
    100%{left:0; top:0;}
    }
    </style>
