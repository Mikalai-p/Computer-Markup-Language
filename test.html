<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>HTML Example</title>
    <style>
        .container {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }
        img {
            width: 200px;
            height: auto;
        }
        p {
            margin: 0;
        }
        #text_block {
            padding-right: 40px; /* Расстояние между текстом и изображением */
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="text_block">
            <p>Текст первого абзаца.</p>
            <p>Текст второго абзаца.</p>
        </div>
        <img src="c:\Users\nikol\Downloads\е34.jpg" alt="Image Description">
    </div>
</body>
</html>
